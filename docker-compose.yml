services:
  smartx-api:
    build:
      context: .
      dockerfile: SmartX.Api/Dockerfile
    ports:
      - "5050:5050"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  smartx-client:
    build:
      context: .
      dockerfile: SmartX.Client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - smartx-api

  smartx-simulator:
    profiles: ["sim"]          # docker compose --profile sim up --build
    build:
      context: .
      dockerfile: SmartX.Simulator/Dockerfile
    environment:
      - SMARTX_API=http://smartx-api:5050
    command: ["run"]
    depends_on:
      - smartx-api
